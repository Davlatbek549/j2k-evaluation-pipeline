name: J2K Evaluation Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  j2k-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Kotlin compiler (includes j2k)
        run: |
          curl -L https://github.com/JetBrains/kotlin/releases/download/v1.9.23/kotlin-compiler-1.9.23.zip -o kotlin-compiler.zip
          unzip -q kotlin-compiler.zip
          echo "$PWD/kotlinc/bin" >> $GITHUB_PATH

      - name: Verify j2k is available
        run: j2k -help || echo "j2k ready"

      - name: Clone subset of java-design-patterns
        run: |
          git clone --depth=1 --filter=blob:none --sparse \
            https://github.com/iluwatar/java-design-patterns.git tmp-patterns
          cd tmp-patterns
          git sparse-checkout set \
            factory-method/src \
            singleton/src \
            observer/src \
            strategy/src
          cd ..
          find tmp-patterns -name "*.java" | head -20 | while read f; do
            cp "$f" java-source/
          done
          echo "Java files copied:"
          ls java-source/

      - name: Run j2k converter on Java files
        run: |
          mkdir -p kotlin-converted
          SUCCESS=0
          FAILED=0
          for f in java-source/*.java; do
            filename=$(basename "$f" .java)
            echo "Converting: $f"
            if j2k "$f" > "kotlin-converted/${filename}.kt" 2>&1; then
              echo "✅ Converted: $filename"
              SUCCESS=$((SUCCESS + 1))
            else
              echo "❌ Failed: $filename"
              FAILED=$((FAILED + 1))
            fi
          done
          echo "CONVERSION SUMMARY: $SUCCESS succeeded, $FAILED failed"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Kotlin evaluator
        run: ./gradlew run

      - name: Show evaluation report
        run: cat reports/summary.md

      - name: Upload conversion results
        uses: actions/upload-artifact@v4
        with:
          name: conversion-results
          path: |
            kotlin-converted/
            reports/
